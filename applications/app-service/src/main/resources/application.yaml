server:
  port: 8083

spring:
  application:
    name: "ms-bootcamp"
  devtools:
    add-properties: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: "${R2DBC_PORT}"
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"

springdoc:
  swagger-ui:
    path: "/bootcamp/api/doc/swagger-ui.html"
  api-docs:
    path: "/bootcamp/api/doc/api-docs"

routes:
  paths:
    bootcamps: "/bootcamp/api/v1/bootcamps"
    bootcampsList: "/bootcamp/api/v1/bootcamps/list"
    delete-bootcamp-by-id: "/bootcamp/api/v1/bootcamps/{bootcampId}"

adapter:
  restconsumer:
    technology-url: "http://localhost:8081"
    capability-url: "http://localhost:8082"
    timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      associateCapabilitiesCB:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"

